[project]
name = "llmgr"
version = "0.1.0"
description = "CLI for managing llama-server instances across GPU hosts"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
llm = "main:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.12"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main"]
